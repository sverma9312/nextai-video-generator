name: Daily Video Generator (Shorts & Reels)

on:
  schedule:
    # Runs twice daily: 04:00 UTC (09:30 AM IST) & 14:00 UTC (07:30 PM IST)
    - cron: '0 4,14 * * *'
  workflow_dispatch:
    inputs:
      retry_last:
        description: 'Retry uploading last video (skips already posted platforms unless force=true)'
        required: false
        type: boolean
        default: false
      publish_youtube:
        description: 'Publish / retry YouTube Shorts'
        required: false
        type: boolean
        default: true
      publish_instagram:
        description: 'Publish / retry Instagram Reels'
        required: false
        type: boolean
        default: true
      search_query:
        description: 'Story search keyword or headline (e.g. "ChatGPT Wallet")'
        required: false
        type: string
      force:
        description: 'Force upload even if URL already exists in archive ledger'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Run script and audio synthesis without rendering full MP4'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install system dependencies for headless video rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Install Node dependencies
        run: pnpm install

      - name: Download Previous Video Artifact (Retry Mode)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.retry_last }}
        run: |
          mkdir -p out build
          echo "Looking for previous workflow run artifact to reuse rendered video..."
          PREV_RUN_ID=$(gh run list --workflow="daily-video.yml" --limit 5 --json databaseId -q '.[] | select(.databaseId != ${{ github.run_id }}) | .databaseId' | head -n 1)
          if [ -n "$PREV_RUN_ID" ]; then
            echo "Downloading artifacts from run #$PREV_RUN_ID..."
            gh run download "$PREV_RUN_ID" --dir ./downloaded_artifacts || true
            find ./downloaded_artifacts -name "*.mp4" -exec cp {} out/ \; || true
            find ./downloaded_artifacts -name "*_audio.mp3" -exec cp {} build/ \; || true
            find ./downloaded_artifacts -name "*_subtitles.json" -exec cp {} build/ \; || true
            rm -rf ./downloaded_artifacts
          fi
          echo "Available files in out/:"
          ls -la out/ || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Video Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_VOICE_NAME: 'en-US-AndrewMultilingualNeural'
          VIDEO_VOICE_RATE: '+6%'
          RETRY_LAST: ${{ inputs.retry_last }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          FORCE_RUN: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENABLE_YOUTUBE_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_youtube) || vars.ENABLE_YOUTUBE_PUBLISH || secrets.ENABLE_YOUTUBE_PUBLISH || 'false' }}
          ENABLE_INSTAGRAM_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_instagram) || vars.ENABLE_INSTAGRAM_PUBLISH || secrets.ENABLE_INSTAGRAM_PUBLISH || 'false' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: pnpm generate:latest

      - name: Upload Rendered Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-vertical-video-${{ github.run_number }}
          path: |
            out/*.mp4
            build/*_audio.mp3
            build/*_subtitles.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit Updated Posted Archive Ledger
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NextAI Autonomous Video Bot"
          if [[ -n $(git status -s data/posted_archive.json) ]]; then
            git add data/posted_archive.json
            git commit -m "chore(archive): record published daily video [skip ci]"
            git pull --rebase origin main || true
            git push origin main || true
          else
            echo "No new stories recorded in posted archive."
          fi

      - name: Pipeline Failure Alert & Summary
        if: failure()
        run: |
          echo "### ❌ Pipeline Execution Failed" >> $GITHUB_STEP_SUMMARY
          echo "An error occurred during video rendering or social media distribution (YouTube / Instagram)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository:** \`${{ github.repository }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** \`#${{ github.run_number }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By:** \`${{ github.actor }}\` (\`${{ github.event_name }}\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 💡 **Alert Dispatched:** Notification sent to designated team channels. Check logs above for exact API error traces." >> $GITHUB_STEP_SUMMARY

      - name: Send Failure Notification Email to NextAI Team
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL_PASS: ${{ secrets.NOTIFY_EMAIL_PASS }}
          NOTIFY_EMAIL_USER: ${{ secrets.NOTIFY_EMAIL_USER || 'nextaiapps.team@gmail.com' }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO || 'contact@nextai-apps.com' }}
          REPO_NAME: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request, ssl, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart

          resend_key = os.environ.get('RESEND_API_KEY')
          smtp_pass = os.environ.get('NOTIFY_EMAIL_PASS')
          recipient = os.environ.get('NOTIFY_EMAIL_TO', 'contact@nextai-apps.com')
          repo = os.environ.get('REPO_NAME', 'sverma9312/nextai-video-generator')
          run_number = os.environ.get('RUN_NUMBER', '0')
          run_id = os.environ.get('RUN_ID', '0')
          actor = os.environ.get('ACTOR', 'system')
          event = os.environ.get('EVENT_NAME', 'workflow_dispatch')

          subject = f"🚨 [{repo}] AIShort Video Pipeline Failure Alert (Run #{run_number})"
          html_body = f"""
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <style>
              body {{ font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0b0f17; color: #e2e8f0; margin: 0; padding: 24px; }}
              .card {{ background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; max-width: 600px; margin: 0 auto; overflow: hidden; }}
              .header {{ background-color: #1f1315; border-bottom: 1px solid #371b20; padding: 20px 24px; }}
              .badge {{ display: inline-block; background-color: #FF4820; color: #ffffff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 4px 8px; border-radius: 4px; }}
              .title {{ margin: 12px 0 0 0; color: #ffffff; font-size: 20px; font-weight: 600; }}
              .content {{ padding: 24px; }}
              .desc {{ color: #94a3b8; font-size: 14px; line-height: 1.5; margin-top: 0; }}
              .table {{ width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 14px; }}
              .table td {{ padding: 10px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }}
              .table td.label {{ color: #64748b; font-weight: 500; width: 35%; }}
              .btn-container {{ margin-top: 28px; text-align: center; }}
              .btn {{ display: inline-block; background-color: #FF4820; color: #ffffff !important; text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 24px; border-radius: 8px; }}
              .footer {{ border-top: 1px solid #1e293b; padding: 16px 24px; font-size: 12px; color: #475569; text-align: center; }}
              .note {{ background-color: #1e1b18; border-left: 3px solid #f59e0b; padding: 12px 14px; margin-top: 16px; border-radius: 0 6px 6px 0; font-size: 13px; color: #d97706; }}
            </style>
          </head>
          <body>
            <div class="card">
              <div class="header">
                <span class="badge">NextAI Production Alert</span>
                <h1 class="title">🚨 AIShort Video Pipeline Execution Failed</h1>
              </div>
              <div class="content">
                <p class="desc">A failure occurred during social media distribution (YouTube or Instagram). Please check the details below.</p>
                
                <table class="table">
                  <tr>
                    <td class="label">Repository</td>
                    <td><strong>{repo}</strong></td>
                  </tr>
                  <tr>
                    <td class="label">Workflow Run</td>
                    <td>#{run_number}</td>
                  </tr>
                  <tr>
                    <td class="label">Triggered By</td>
                    <td>{actor} ({event})</td>
                  </tr>
                  <tr>
                    <td class="label">Primary Impact</td>
                    <td>Social Upload Incomplete</td>
                  </tr>
                </table>

                <div class="note">
                  <strong>💡 Deduplication Ledger Preserved:</strong><br/>
                  If one platform succeeded (e.g. YouTube or Instagram), its published URL was safely recorded in Git. Running a Retry will skip already published channels and only retry the failed platform.
                </div>

                <div class="btn-container">
                  <a href="https://github.com/{repo}/actions/runs/{run_id}" class="btn">View Failed Run & Logs in GitHub</a>
                </div>
              </div>
              <div class="footer">
                Autonomous Pipeline Monitor · NextAI Studio Ops
              </div>
            </div>
          </body>
          </html>
          """

          sent = False

          # Strategy 1: Resend API
          if resend_key:
              print("📡 Attempting notification via Resend API...")
              payload = {
                  "from": "NextAI Alerts <onboarding@resend.dev>",
                  "to": [recipient],
                  "subject": subject,
                  "html": html_body
              }
              req = urllib.request.Request(
                  "https://api.resend.com/emails",
                  data=json.dumps(payload).encode('utf-8'),
                  headers={
                      "Authorization": f"Bearer {resend_key}",
                      "Content-Type": "application/json",
                      "User-Agent": "NextAI-Workflow-Bot"
                  }
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      data = json.loads(resp.read().decode())
                      print(f"✅ Alert email delivered via Resend to {recipient}! (ID: {data.get('id')})")
                      sent = True
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode()
                  print(f"⚠️ Resend HTTP {e.code}: {err_body}")
              except Exception as e:
                  print(f"⚠️ Resend dispatch error: {e}")

          # Strategy 2: Fallback to SMTP if NOTIFY_EMAIL_PASS is provided
          if not sent and smtp_pass:
              print("📡 Attempting notification via Gmail SMTP...")
              try:
                  sender = os.environ.get('NOTIFY_EMAIL_USER', 'nextaiapps.team@gmail.com')
                  msg = MIMEMultipart('alternative')
                  msg['Subject'] = subject
                  msg['From'] = f"NextAI Bot <{sender}>"
                  msg['To'] = recipient
                  msg.attach(MIMEText(html_body, 'html'))
                  context = ssl.create_default_context()
                  with smtplib.SMTP_SSL("smtp.gmail.com", 465, context=context) as server:
                      server.login(sender, smtp_pass)
                      server.sendmail(sender, [recipient], msg.as_string())
                  print(f"✅ Alert email delivered via Gmail SMTP to {recipient}!")
                  sent = True
              except Exception as e:
                  print(f"⚠️ SMTP dispatch error: {e}")

          if not sent and not resend_key and not smtp_pass:
              print("ℹ️ Neither RESEND_API_KEY nor NOTIFY_EMAIL_PASS is configured. Skipping email dispatch.")
          EOF
